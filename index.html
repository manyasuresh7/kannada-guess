<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kannada Guess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Guess the Kannada Movie</h1>

  <div id="hints"></div>
  <p id="attempts"></p>

  <div id="guess-row">
  <input type="text" id="guess-input" placeholder="Type a movie name">
  <button id="guess-button">Guess</button>
</div>

  <p id="message"></p>
  <button id="share-button" hidden>Share result</button>
  <div id="stats"></div>

  <script src="script.js"></script>
</body>
</html>
